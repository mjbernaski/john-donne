<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library · Reading room</title>
    <link rel="stylesheet" href="styles.css?v=20260911-library">
    <link rel="stylesheet" href="library.css?v=20260911-library">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="library-container">
        <nav class="library-nav" aria-label="Main navigation">
            <a href="index.html">Reading room</a>
            <div><a href="images.html">Images</a><a href="voices.html">Narration voices</a></div>
        </nav>
        <header class="library-heading">
            <p class="library-eyebrow">Your collection</p>
            <h1>The library</h1>
            <p>Poetry, stories, and ideas. Find something to spend time with.</p>
            <a id="continueReading" class="library-continue" href="index.html" hidden></a>
        </header>
        <section class="library-controls" aria-label="Browse the library">
            <label class="library-search">Search the library<input id="librarySearch" type="search" placeholder="Title, author, or translation…" autocomplete="off"></label>
            <label>Sort by<select id="librarySort"><option value="author">Author</option><option value="title">Title</option><option value="category">Category</option></select></label>
            <div id="libraryFilters" class="library-filters" role="group" aria-label="Filter by category"></div>
        </section>
        <p id="libraryStatus" class="library-status" role="status" aria-live="polite">Loading your library…</p>
        <div id="libraryGrid" class="library-grid"></div>
        <button id="libraryReset" class="library-reset" hidden>Clear filters</button>
    </main>
    <script src="library.js?v=20260911-library"></script>
</body>
</html>
