<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narration Voices · Poetry</title>
    <link rel="stylesheet" href="styles.css?v=20260817-42">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="image-manager-page">
    <header class="image-manager-header">
        <div>
            <p class="poem-images-eyebrow">Narration</p>
            <h1>Voices</h1>
            <p id="voicesStatus" class="image-library-status" role="status" aria-live="polite">Loading voices…</p>
        </div>
        <a href="/" class="image-manager-home">Return to poems</a>
    </header>

    <main>
        <p><a href="/faust-voices.html">Explore ElevenLabs voices and compare a Faust scene</a></p>
        <section class="voice-roles" aria-labelledby="voiceRolesTitle">
            <h2 id="voiceRolesTitle" class="voice-roles-title">In use now</h2>
            <div id="voiceRoles" class="voice-roles-list"></div>
        </section>

        <div class="image-library-toolbar image-manager-toolbar">
            <p class="voice-sample-text">Preview text: <em id="voiceSampleText"></em></p>
            <div class="image-manager-actions">
                <button id="voicesPause" class="image-manager-refresh" type="button" hidden>Pause</button>
                <button id="voicesStop" class="image-manager-refresh" type="button" hidden>Stop</button>
            </div>
        </div>

        <div id="voicesGrid" class="voice-grid"></div>
    </main>



    <script src="streaming-tts.js?v=20261023-elevenlabs"></script>
    <script src="voices.js?v=20261025-account"></script>
